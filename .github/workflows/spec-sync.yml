# Nightly: fetch the live v2 OpenAPI document, and when it differs from
# spec/openapi.v2.json regenerate the three SDKs, run their tests and open a PR.
# Has not run yet. Needs repo setting "Allow GitHub
# Actions to create and approve pull requests".
name: spec-sync

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

env:
  SPEC_URL: https://api.vistalink.com/v2/openapi.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the live spec (normalised like scripts/dump_v2_openapi.py)
        id: fetch
        run: |
          set -euo pipefail
          cp spec/openapi.v2.json "$RUNNER_TEMP/previous.json"
          curl -fsSL --retry 3 --retry-all-errors -H "Accept: application/json" "$SPEC_URL" -o "$RUNNER_TEMP/live.json"
          python3 - "$RUNNER_TEMP/live.json" spec/openapi.v2.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc.get("openapi", "").startswith("3.1") and doc.get("paths"), "not an OpenAPI 3.1 document"
          open(sys.argv[2], "w").write(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          PY
          if git diff --quiet -- spec/openapi.v2.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(python3 -c 'import json;print(json.load(open("spec/openapi.v2.json"))["info"]["version"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Spec diff summary
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python3 scripts/spec_diff.py "$RUNNER_TEMP/previous.json" spec/openapi.v2.json --markdown > "$RUNNER_TEMP/diff.md" || true
          {
            echo "Nightly sync of \`spec/openapi.v2.json\` with $SPEC_URL (spec \`info.version\` ${{ steps.fetch.outputs.version }})."
            echo
            echo "SDKs regenerated with \`scripts/regenerate.sh --test\`; versions follow the spec's major.minor (\`scripts/sync_versions.py\`)."
            echo
            echo "<details><summary>Structural diff (previous → live)</summary>"
            echo
            head -c 60000 "$RUNNER_TEMP/diff.md"
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: pnpm/action-setup@v4
        if: steps.fetch.outputs.changed == 'true'
      - uses: actions/setup-node@v4
        if: steps.fetch.outputs.changed == 'true'
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        if: steps.fetch.outputs.changed == 'true'
      - uses: actions/setup-python@v5
        if: steps.fetch.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Regenerate and test
        if: steps.fetch.outputs.changed == 'true'
        run: scripts/regenerate.sh --test

      - name: Open or update the PR
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/spec-sync
          delete-branch: true
          title: "chore(spec): sync with live v2 OpenAPI (${{ steps.fetch.outputs.version }})"
          commit-message: "chore(spec): sync with live v2 OpenAPI (${{ steps.fetch.outputs.version }})"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: spec-sync
          add-paths: |
            spec/openapi.v2.json
            packages/typescript/src/generated/**
            packages/typescript/package.json
            packages/typescript/src/client.ts
            packages/cli/src/generated/**
            packages/cli/package.json
            packages/python/src/vistalink/models.py
            packages/python/src/vistalink/_async_client.py
            packages/python/src/vistalink/_base.py
            packages/python/pyproject.toml
